<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Agent Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 40px;
      width: 340px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    h2 { font-size: 1.4rem; margin-bottom: 6px; color: #f1f5f9; }
    .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 32px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 32px;
      background: #0f172a;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #475569;
    }
    .dot.ready { background: #22c55e; }
    .dot.calling { background: #f59e0b; animation: pulse 1s infinite; }
    .dot.connected { background: #3b82f6; animation: pulse 1s infinite; }
    .dot.error { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    .call-btn {
      width: 90px; height: 90px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 2rem;
      margin-bottom: 16px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .call-btn.idle {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 8px 24px rgba(34,197,94,0.35);
    }
    .call-btn.idle:hover { transform: scale(1.07); }
    .call-btn.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 24px rgba(239,68,68,0.35);
    }
    .call-btn.active:hover { transform: scale(1.07); }
    .call-btn:disabled {
      background: #334155;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-label { font-size: 0.85rem; color: #64748b; }
    .log {
      margin-top: 28px;
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: left;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="card">
  <h2>Voice Agent Tester</h2>
  <p class="subtitle">Browser → Twilio → Your Voice Agent</p>

  <div class="status-badge">
    <span class="dot" id="dot"></span>
    <span id="status-text">Initializing...</span>
  </div>

  <br>
  <button class="call-btn idle" id="callBtn" onclick="toggleCall()" disabled>📞</button>
  <p class="btn-label" id="btn-label">Loading...</p>

  <div class="log" id="log">Connecting to Twilio...</div>
</div>

<script>
  let device = null;
  let activeCall = null;

  function log(msg) {
    const el = document.getElementById('log');
    el.innerHTML += `<div>${new Date().toLocaleTimeString()} — ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  function setStatus(state, text) {
    document.getElementById('dot').className = `dot ${state}`;
    document.getElementById('status-text').textContent = text;
  }

  async function init() {
    try {
      const res = await fetch('/api/calls/browser-token/');
      const data = await res.json();
      const token = data.token;

      device = new Twilio.Device(token, { logLevel: 1 });

      device.on('registered', () => {
        setStatus('ready', 'Ready');
        document.getElementById('callBtn').disabled = false;
        document.getElementById('btn-label').textContent = 'Call Voice Agent';
        log('Device registered. Ready to call.');
      });

      device.on('error', (err) => {
        setStatus('error', 'Error');
        log(`Error: ${err.message}`);
      });

      device.on('connect', (call) => {
        setStatus('connected', 'Connected');
        log('Call connected.');
      });

      device.on('disconnect', () => {
        setStatus('ready', 'Ready');
        activeCall = null;
        const btn = document.getElementById('callBtn');
        btn.className = 'call-btn idle';
        btn.textContent = '📞';
        document.getElementById('btn-label').textContent = 'Call Voice Agent';
        log('Call ended.');
      });

      await device.register();
    } catch (e) {
      setStatus('error', 'Failed to init');
      log(`Init error: ${e.message}`);
    }
  }

  async function toggleCall() {
    if (activeCall) {
      activeCall.disconnect();
      return;
    }
    try {
      setStatus('calling', 'Calling...');
      document.getElementById('btn-label').textContent = 'Hang up';
      const btn = document.getElementById('callBtn');
      btn.className = 'call-btn active';
      btn.textContent = '📵';
      log('Calling voice agent...');
      activeCall = await device.connect();
      activeCall.on('disconnect', () => {
        activeCall = null;
        setStatus('ready', 'Ready');
        btn.className = 'call-btn idle';
        btn.textContent = '📞';
        document.getElementById('btn-label').textContent = 'Call Voice Agent';
        log('Call ended.');
      });
    } catch (e) {
      setStatus('error', 'Call failed');
      log(`Call error: ${e.message}`);
    }
  }

  function loadScript(url) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load: ' + url));
      document.head.appendChild(s);
    });
  }

  async function bootstrap() {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.3.2/dist/twilio.min.js',
      'https://unpkg.com/@twilio/voice-sdk@2.3.2/dist/twilio.min.js',
    ];
    for (const url of urls) {
      try {
        await loadScript(url);
        if (typeof Twilio !== 'undefined') {
          log('SDK loaded from: ' + url.split('/').slice(-1)[0]);
          await init();
          return;
        }
      } catch(e) {
        log('Skipping ' + url.split('/releases/')[1] + ' — ' + e.message);
      }
    }
    setStatus('error', 'SDK failed to load');
    log('Could not load Twilio SDK from any source.');
  }

  window.addEventListener('load', bootstrap);
</script>
</body>
</html>
