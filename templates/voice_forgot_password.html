<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Deskline</title>
{% load static %}
<link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
<link rel="stylesheet" href="{% static 'css/deskline-toast.css' %}">
<script src="{% static 'js/deskline-toast.js' %}"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500;9..144,600;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',system-ui,sans-serif; background:#FBF8F1; color:#0f172a; }
  .input-field { width:100%; background:#fff; border:1.5px solid #e2e8f0; border-radius:8px; padding:10px 14px; font-size:13.5px; color:#0f172a; outline:none; transition:border 0.15s,box-shadow 0.15s; }
  .input-field::placeholder { color:#94a3b8; }
  .input-field:focus { border-color:#A9814A; box-shadow:0 0 0 3px rgba(169,129,74,0.12); }
  .label { display:block; font-size:12.5px; font-weight:600; color:#374151; margin-bottom:5px; }
  .btn-primary { width:100%; background:#A9814A; color:#1B1408; font-weight:600; padding:13px; border-radius:4px; font-size:14px; cursor:pointer; border:none; transition:all 0.2s; box-shadow:0 8px 24px rgba(169,129,74,0.3); }
  .btn-primary:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 16px rgba(169,129,74,0.4); }
  .btn-primary:disabled { opacity:0.65; cursor:not-allowed; transform:none; }
</style>
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-[#FBF8F1] to-[#F6F1E4] p-6">

<div id="toast-container"></div>

<div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-100 p-8">

  <div class="flex items-center gap-2 mb-8">
    <a href="{% url 'home' %}" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:#A9814A;">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#1B1408" stroke-width="1.7"><path d="M3 10.5L12 4l9 6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V19a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V9.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 13.2c1-1.4 4-1.4 5 0" stroke-linecap="round"/></svg>
      </div>
      <span class="display font-bold text-sm text-slate-800" style="letter-spacing:0.02em;">Deskline</span>
    </a>
  </div>

  <!-- Icon -->
  <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-5" style="background:#F0E6D4;">
    <svg class="w-6 h-6" style="color:#16332B;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
    </svg>
  </div>

  <!-- Form state -->
  <div id="form-state">
    <h1 class="display text-xl text-slate-800 mb-1" style="letter-spacing:-0.02em;">Forgot your password?</h1>
    <p class="text-sm text-slate-500 mb-6">Enter your work email and we'll send you a reset link.</p>

    <form id="forgot-form" method="post" action="javascript:void(0)">
      {% csrf_token %}
      <div class="mb-5">
        <label class="label">Work email</label>
        <input id="email" type="email" class="input-field" placeholder="you@company.com" />
      </div>
      <button type="submit" id="submit-btn" class="btn-primary mb-4">Send reset link</button>
    </form>
  </div>

  <!-- Success state (hidden initially) -->
  <div id="success-state" class="hidden text-center">
    <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4" style="background:#f0fdf4;">
      <svg class="w-6 h-6 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
    </div>
    <h2 class="text-lg font-bold text-slate-800 mb-2">Check your inbox</h2>
    <p class="text-sm text-slate-500 mb-6">If this email is registered, a reset link has been sent. Check your spam folder if you don't see it.</p>
    <a href="/api/auth/login/" class="btn-primary block text-center" style="text-decoration:none;">Back to login</a>
  </div>

  <p class="text-center text-sm text-slate-500 mt-4">
    Remember your password?
    <a href="{% url 'login-render' %}" class="font-semibold" style="color:#16332B;">Sign in</a>
  </p>
</div>

<script>
const FORGOT_API = "/api/auth/forgot-password/api/";

document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) {
    showToast('Please enter your email address.', 'info');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const res = await fetch(FORGOT_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();

    if (!res.ok) {
      showToast(data.message || 'Something went wrong. Please try again.', 'error');
      return;
    }

    document.getElementById('form-state').classList.add('hidden');
    document.getElementById('success-state').classList.remove('hidden');
  } catch {
    showToast('Network error. Please check your connection.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  }
});

function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}
</script>
</body>
</html>
